name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile api/index.py api/honours.py api/degree.py api/masters.py api/common/security.py

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/core.js
          node --check public/assets/js/app.js

      - name: Run backend unit tests
        env:
          SESSION_SIGNING_SECRET: ci-test-secret
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check required project files
        run: |
          test -f api/index.py
          test -f api/honours.py
          test -f api/degree.py
          test -f api/masters.py
          test -f api/common/security.py
          test -f public/index.html
          test -f public/honours/index.html
          test -f public/degree/index.html
          test -f public/masters/index.html
          test -f public/components/header.html
          test -f public/components/nav.html
          test -f public/components/footer.html
          test -f public/assets/css/styles.css
          test -f public/assets/js/core.js
          test -f public/assets/js/app.js
          test -f public/how-to-use.html
          test -f public/grading.html
          test -f public/about.html
          test -f public/privacy.html
          test -f public/disclaimer.html
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f vercel.json
          test -f requirements.txt
