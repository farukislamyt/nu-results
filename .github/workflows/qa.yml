name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile api/index.py

      - name: Check JavaScript syntax
        run: node --check public/assets/js/app.js

      - name: Run backend unit tests
        env:
          SESSION_SIGNING_SECRET: ci-test-secret
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check required project files
        run: |
          test -f api/index.py
          test -f public/index.html
          test -f public/assets/css/styles.css
          test -f public/assets/js/app.js
          test -f public/pages/how-to-use.html
          test -f public/pages/grading.html
          test -f public/pages/about.html
          test -f public/pages/privacy.html
          test -f public/pages/disclaimer.html
          test -f vercel.json
          test -f requirements.txt
