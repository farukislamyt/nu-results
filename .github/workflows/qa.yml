name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile api/index.py

      - name: Check JavaScript syntax
        run: node --check public/app.js

      - name: Check required public files
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/how-to-use.html
          test -f public/grading.html
          test -f public/about.html
          test -f public/privacy.html
          test -f public/disclaimer.html
